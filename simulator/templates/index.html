<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Micromouse Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #4caf50;
            margin-bottom: 10px;
        }
        #canvas-container {
            background-color: #121214;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas {
            border: 2px solid #333;
        }
        #telemetry {
            margin-top: 15px;
            font-family: monospace;
            background: #2a2a35;
            padding: 10px 20px;
            border-radius: 5px;
            width: 400px;
            display: flex;
            justify-content: space-between;
        }
        .stat {
            display: flex;
            flex-direction: column;
        }
        .label { color: #888; font-size: 0.8rem; }
        .val { color: #00e676; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

    <h1>ARC Micromouse Dashboard</h1>
    <p>Open <code>student_agent/solver.py</code> to program your navigation algorithm.</p>

    <div id="canvas-container">
        <canvas id="simCanvas" width="550" height="550"></canvas>
    </div>

    <div id="telemetry">
        <div class="stat">
            <span class="label">X Coord</span>
            <span id="pos-x" class="val">0.00</span>
        </div>
        <div class="stat">
            <span class="label">Y Coord</span>
            <span id="pos-y" class="val">0.00</span>
        </div>
        <div class="stat">
            <span class="label">Heading (Rad)</span>
            <span id="pos-theta" class="val">0.00</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // Connect to our FastAPI WebSocket backend stream
        const ws = new WebSocket(`ws://${window.location.host}/ws`);

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const mouse = data.mouse;
            const maze = data.maze;
            const goal = data.goal;

            const rows = maze.length;
            const cols = maze[0].length;
            
            // Dynamically size cells to fit snugly inside our canvas space
            const cellWidth = canvas.width / cols;
            const cellHeight = canvas.height / rows;

            // Clear frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw the Maze Grid Layout Matrix
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (maze[r][c] === 1) {
                        ctx.fillStyle = '#37474f'; // Dark slate grey for solid walls
                        ctx.fillRect(c * cellWidth, r * cellHeight, cellWidth, cellHeight);
                    } else {
                        ctx.strokeStyle = '#263238'; // Light grid boundary lines
                        ctx.strokeRect(c * cellWidth, r * cellHeight, cellWidth, cellHeight);
                    }
                }
            }

            // 2. Highlight the Target Goal Coordinates Cell
            ctx.fillStyle = 'rgba(233, 30, 99, 0.4)'; // Semitransparent pink/red target box
            ctx.fillRect(Math.floor(goal[0]) * cellWidth, Math.floor(goal[1]) * cellHeight, cellWidth, cellHeight);

            // 3. Render the Virtual Micromouse (Triangular Heading Representation)
            const mouseCanvasX = mouse.x * cellWidth;
            const mouseCanvasY = mouse.y * cellHeight;
            const mouseSize = Math.min(cellWidth, cellHeight) * 0.4;

            ctx.save();
            ctx.translate(mouseCanvasX, mouseCanvasY);
            ctx.rotate(mouse.theta); // Rotates the rendering engine context to match structural heading orientation

            // Draw directional pointer mouse triangle
            ctx.beginPath();
            ctx.moveTo(mouseSize, 0);                 // Nose point
            ctx.lineTo(-mouseSize, -mouseSize * 0.7); // Rear left corner
            ctx.lineTo(-mouseSize, mouseSize * 0.7);  // Rear right corner
            ctx.closePath();
            
            ctx.fillStyle = '#2196f3'; // Clean electrical blue
            ctx.fill();
            ctx.restore();

            // 4. Draw Sensor Raycasts (Visualizing Left, Front, Right sensor beams)
            const sensorAngles = [Math.PI / 2, 0, -Math.PI / 2]; // Match order in backend: Left, Front, Right
            ctx.strokeStyle = 'rgba(255, 235, 59, 0.4)'; // Faint translucent yellow sensor rays
            ctx.lineWidth = 1.5;

            for (let i = 0; i < 3; i++) {
                const beamLength = mouse.sensors[i];
                const absoluteAngle = mouse.theta + sensorAngles[i];
                
                ctx.beginPath();
                ctx.moveTo(mouseCanvasX, mouseCanvasY);
                ctx.lineTo(
                    mouseCanvasX + (beamLength * cellWidth) * Math.cos(absoluteAngle),
                    mouseCanvasY + (beamLength * cellHeight) * Math.sin(absoluteAngle)
                );
                ctx.stroke();
            }

            // 5. Update numerical dashboard readout statistics panels
            document.getElementById('pos-x').innerText = mouse.x.toFixed(2);
            document.getElementById('pos-y').innerText = mouse.y.toFixed(2);
            document.getElementById('pos-theta').innerText = mouse.theta.toFixed(2);
        };

        ws.onclose = function() {
            console.log("Telemetry connection broken. Server dead?");
        };
    </script>
</body>
</html>
