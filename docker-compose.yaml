version: '3.8'

services:
  micromouse_simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cni_micromouse_container
    ports:
      - "5000:5000"  # Maps port 5000 on their Mac browser to port 5000 inside the Linux container
    volumes:
      # This binds their local folders into the container. 
      # Any edits they make in VS Code on their Mac update inside the container instantly!
      - .:/workspace
    environment:
      - ROS_DOMAIN_ID=42  # Isolates their ROS network traffic from others on the same Wi-Fi
      - PYTHONPATH=/workspace
    ipc: host  # Optimizes shared memory communication for ROS 2 nodes
    restart: unless-stopped